    <meta name="theme-color" content="#f6f6f2" />
    <script>
      (function () {
        var theme = "system";
        try {
          var stored = window.localStorage.getItem("aiNewsRadarTheme") || "system";
          if (stored === "dark" || stored === "light" || stored === "system") theme = stored;
        } catch (err) {
          theme = "system";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var resolved = theme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : theme;
        document.documentElement.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = resolved === "dark" ? "#161513" : "#f6f6f2";
      })();
    </script>
